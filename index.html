<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
      * { box-sizing: border-box; }
      body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; padding: 20px; background: #f4f4f9; margin: 0; }
      h1 { text-align: center; color: #333; margin-bottom: 15px; }
      
      /* Search Controls */
      .search-container { max-width: 600px; margin: 0 auto 25px auto; display: flex; gap: 10px; }
      .search-input { flex: 1; padding: 12px 16px; font-size: 16px; border: 1px solid #ccc; border-radius: 6px; outline: none; }
      .search-input:focus { border-color: #3498db; box-shadow: 0 0 5px rgba(52, 152, 219, 0.4); }

      /* Grid & Cards */
      .grid { display: flex; flex-wrap: wrap; gap: 20px; justify-content: center; max-width: 1200px; margin: 0 auto; }
      .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); width: 300px; display: flex; flex-direction: column; justify-content: space-between; }
      
      .img-wrapper { position: relative; cursor: pointer; border-radius: 4px; overflow: hidden; height: 200px; background: #eee; }
      .card img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.2s; }
      .img-wrapper:hover img { transform: scale(1.03); }
      .gallery-badge { position: absolute; bottom: 8px; right: 8px; background: rgba(0,0,0,0.7); color: #fff; padding: 4px 8px; border-radius: 4px; font-size: 12px; font-weight: bold; }

      .card h2 { font-size: 1.2rem; margin: 12px 0 6px 0; color: #2c3e50; }
      .price { font-size: 1.25em; font-weight: bold; color: #2ecc71; margin: 6px 0 12px 0; }
      .desc { color: #555; font-size: 0.95rem; line-height: 1.4; margin-bottom: 15px; }
      
      .buttons { display: flex; gap: 10px; margin-top: auto; }
      .btn { padding: 10px 15px; text-decoration: none; color: white; border-radius: 4px; text-align: center; flex: 1; font-size: 14px; font-weight: bold; border: none; display: inline-block; }
      .btn-text { background: #3498db; }
      .btn-text:hover { background: #2980b9; }
      .btn-email { background: #e74c3c; }
      .btn-email:hover { background: #c0392b; }
      
      #no-results { text-align: center; font-size: 1.2em; color: #777; width: 100%; display: none; margin-top: 20px; }

      /* Modal Styling */
      .modal { display: none; position: fixed; z-index: 9999; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.85); justify-content: center; align-items: center; flex-direction: column; padding: 20px; }
      .modal-content { max-width: 90%; max-height: 75vh; border-radius: 8px; object-fit: contain; }
      .modal-controls { display: flex; gap: 20px; margin-top: 15px; align-items: center; }
      .modal-btn { background: #fff; color: #333; border: none; padding: 8px 16px; border-radius: 4px; font-weight: bold; cursor: pointer; }
      .modal-close { position: absolute; top: 15px; right: 25px; color: white; font-size: 35px; font-weight: bold; cursor: pointer; }
      .modal-counter { color: #fff; font-size: 14px; font-weight: bold; }
    </style>
  </head>
  <body>
    <h1>Vehicle Inventory</h1>
    
    <div class="search-container">
      <input type="text" id="search-input" class="search-input" placeholder="Search by stock #, year, make, or details..." oninput="filterInventory()">
    </div>

    <div class="grid" id="inventory-grid"></div>
    <div id="no-results">No vehicles match your search.</div>

    <!-- Image Gallery Modal -->
    <div id="gallery-modal" class="modal" onclick="closeModal(event)">
      <span class="modal-close" onclick="closeModalDirect()">&times;</span>
      <img id="modal-img" class="modal-content" src="" alt="Gallery Image">
      <div class="modal-controls" onclick="event.stopPropagation()">
        <button class="modal-btn" onclick="changeImage(-1)">&laquo; Prev</button>
        <span id="modal-counter" class="modal-counter">1 / 1</span>
        <button class="modal-btn" onclick="changeImage(1)">Next &raquo;</button>
      </div>
    </div>

      function renderCards(items) {
        const container = document.getElementById('inventory-grid');
        const noResults = document.getElementById('no-results');
        container.innerHTML = '';

        if (items.length === 0) {
          noResults.style.display = 'block';
          return;
        }
        noResults.style.display = 'none';

        items.forEach((car, index) => {
          const card = document.createElement('div');
          card.className = 'card';
          
          const galleryCount = car.gallery ? car.gallery.length : 1;
          const badgeHtml = galleryCount > 1 ? `<div class="gallery-badge">📷 ${galleryCount} Photos</div>` : '';

          card.innerHTML = `
            <div>
              <div class="img-wrapper" onclick="openGallery(${index})">
                <img src="${car.thumb}" alt="${car.name}">
                ${badgeHtml}
              </div>
              <h2>${car.name} (${car.stock})</h2>
              <p class="price">${car.price}</p>
              <p class="desc">${car.desc}</p>
            </div>
            <div class="buttons">
              <a href="${car.sms}" class="btn btn-text">Text Us</a>
              <a href="${car.email}" class="btn btn-email">Email Us</a>
            </div>
          `;
          container.appendChild(card);
        });
      }

      function filterInventory() {
        const query = document.getElementById('search-input').value.toLowerCase();
        const filtered = inventory.filter(car => {
          return car.name.toLowerCase().includes(query) ||
                 car.stock.toString().includes(query) ||
                 car.desc.toLowerCase().includes(query) ||
                 car.price.toLowerCase().includes(query);
        });
        renderCards(filtered);
      }

      let currentGallery = [];
      let currentIndex = 0;

      function openGallery(carIndex) {
        currentGallery = inventory[carIndex].gallery || [inventory[carIndex].thumb];
        currentIndex = 0;
        updateModal();
        document.getElementById('gallery-modal').style.display = 'flex';
      }

      function changeImage(direction) {
        currentIndex += direction;
        if (currentIndex < 0) currentIndex = currentGallery.length - 1;
        if (currentIndex >= currentGallery.length) currentIndex = 0;
        updateModal();
      }

      function updateModal() {
        document.getElementById('modal-img').src = currentGallery[currentIndex];
        document.getElementById('modal-counter').innerText = `${currentIndex + 1} / ${currentGallery.length}`;
      }

      function closeModal(e) {
        if (e.target.id === 'gallery-modal') {
          document.getElementById('gallery-modal').style.display = 'none';
        }
      }

      function closeModalDirect() {
        document.getElementById('gallery-modal').style.display = 'none';
      }

      renderCards(inventory);
    </script>
