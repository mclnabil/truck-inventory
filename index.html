<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vehicle Inventory</title>
    <style>
      body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; padding: 20px; background: #f4f4f9; margin: 0; }
      h1 { text-align: center; color: #333; margin-bottom: 25px; }
      .grid { display: flex; flex-wrap: wrap; gap: 20px; justify-content: center; max-width: 1200px; margin: 0 auto; }
      .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); width: 300px; display: flex; flex-direction: column; justify-content: space-between; box-sizing: border-box; }
      .card img { width: 100%; height: 200px; object-fit: cover; border-radius: 4px; background: #eee; }
      .card h2 { font-size: 1.2rem; margin: 12px 0 6px 0; color: #2c3e50; }
      .price { font-size: 1.25em; font-weight: bold; color: #2ecc71; margin: 6px 0 12px 0; }
      .desc { color: #555; font-size: 0.95rem; line-height: 1.4; margin-bottom: 15px; }
      .buttons { display: flex; gap: 10px; margin-top: auto; }
      .btn { padding: 10px 15px; text-decoration: none; color: white; border-radius: 4px; text-align: center; flex: 1; font-size: 14px; font-weight: bold; border: none; display: inline-block; box-sizing: border-box; }
      .btn-text { background: #3498db; }
      .btn-text:hover { background: #2980b9; }
      .btn-email { background: #e74c3c; }
      .btn-email:hover { background: #c0392b; }
      #loading { text-align: center; font-size: 1.2em; color: #666; margin-top: 40px; }
    </style>
  </head>
  <body>
    <h1>Vehicle Inventory</h1>
    
    <div id="loading">Loading inventory...</div>
    <div class="grid" id="inventory-grid"></div>

    <script>
      // Your exact published Google Sheet CSV endpoint
      const csvUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSJx9N5KRKNFufYIpBiKQNmZ99m3TOkx-87oaPM4UYZxhELzYUSTKMJY8_3h5HxeJPMMNUGcBpyzkIT/pub?output=csv';

      // Helper function to handle CSV parsing with quotes and commas safely
      function parseCSV(text) {
        let p = '', c = '', r = [];
        let q = false;
        let row = [''];
        for (let i = 0; i < text.length; i++) {
          c = text[i];
          p = text[i - 1];
          if (c === '"') {
            if (q && p === '"') { row[row.length - 1] += '"'; }
            q = !q;
          } else if (c === ',' && !q) {
            row.push('');
          } else if ((c === '\r' || c === '\n') && !q) {
            if (p !== '\r') { r.push(row); row = ['']; }
          } else {
            row[row.length - 1] += c;
          }
        }
        if (row.length > 1 || row[0] !== '') { r.push(row); }
        return r;
      }

      fetch(csvUrl)
        .then(res => res.text())
        .then(csvText => {
          const data = parseCSV(csvText);
          const container = document.getElementById('inventory-grid');
          document.getElementById('loading').style.display = 'none';

          if (!data || data.length <= 1) {
            document.getElementById('loading').innerText = 'No inventory found.';
            document.getElementById('loading').style.display = 'block';
            return;
          }

          // Row 0 contains column headers; data starts at index 1
          for (let i = 1; i < data.length; i++) {
            const row = data[i];
            
            // Extract by exact column indexes:
            // 0: Stock, 1: Name, 5: Price, 6: Description, 7: Thumbnail, 11: SMS Link, 12: Email Link
            const stock = row[0] || '';
            const title = row[1] || '';
            const price = row[5] || '';
            const desc  = row[6] || '';
            const img   = row[7] || '';
            const sms   = row[11] || '';
            const email = row[12] || '';

            if (!stock && !title) continue;

            const card = document.createElement('div');
            card.className = 'card';
            card.innerHTML = `
              <div>
                <img src="${img || 'https://via.placeholder.com/300x200?text=No+Image'}" alt="${title}">
                <h2>${title} (${stock})</h2>
                <p class="price">${price.startsWith('$') ? price : '$' + price}</p>
                <p class="desc">${desc}</p>
              </div>
              <div class="buttons">
                <a href="${sms || '#'}" class="btn btn-text">Text Us</a>
                <a href="${email || '#'}" class="btn btn-email">Email Us</a>
              </div>
            `;
            container.appendChild(card);
          }
        })
        .catch(err => {
          console.error(err);
          document.getElementById('loading').innerText = 'Failed to load inventory from published link.';
        });
    </script>
  </body>
</html>
