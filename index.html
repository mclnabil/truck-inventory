<script>
  // Your exact Spreadsheet ID from Google Sheets
  const SPREADSHEET_ID = '1EIsgD4q8X56IAn50L9GkI22u37fI4Q3xZJ8vS-v0m-Q'; 
  
  // MUST match the tab name at the bottom of your Google Sheet
  const TAB_NAME = 'Vehicle Showcase Inventory V3'; 

  const apiUrl = `https://opensheet.elk.sh/${SPREADSHEET_ID}/${encodeURIComponent(TAB_NAME)}`;

  fetch(apiUrl)
    .then(response => {
      if (!response.ok) {
        throw new Error('Network response was not ok');
      }
      return response.json();
    })
    .then(vehicles => {
      document.getElementById('loading').style.display = 'none';
      const container = document.getElementById('inventory-grid');
      
      if (!vehicles || vehicles.length === 0) {
        document.getElementById('loading').innerText = 'No inventory found.';
        document.getElementById('loading').style.display = 'block';
        return;
      }

      vehicles.forEach(car => {
        // Skip empty rows if any exist in the spreadsheet
        if (!car['Stock Number'] && !car['Vehicle Name']) return;

        const card = document.createElement('div');
        card.className = 'card';
        
        // Grab values with fallback defaults so missing data won't break the page
        const thumbnail = car['Thumbnail'] || 'https://via.placeholder.com/300x200?text=No+Image';
        const title = car['Vehicle Name'] || 'Vehicle';
        const stock = car['Stock Number'] || 'N/A';
        const price = car['Price'] ? `$${car['Price']}` : 'Call for Price';
        const description = car['Description'] || '';
        const smsLink = car['SMS Link'] || '#';
        const emailLink = car['Email Link'] || '#';

        card.innerHTML = `
          <div>
            <img src="${thumbnail}" alt="${title}">
            <h2>${title} (${stock})</h2>
            <p class="price">${price}</p>
            <p>${description}</p>
          </div>
          <div class="buttons">
            <a href="${smsLink}" class="btn btn-text">Text Us</a>
            <a href="${emailLink}" class="btn btn-email">Email Us</a>
          </div>
        `;
        container.appendChild(card);
      });
    })
    .catch(error => {
      console.error('Error fetching data:', error);
      document.getElementById('loading').innerText = 'Failed to load inventory. Check spreadsheet sharing permissions.';
    });
</script>
